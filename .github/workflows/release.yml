name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      packages: write
    steps:
      - name: Checkout (full history for changesets)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run changeset:version
          publish: bun run changeset:publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN must be added to repo secrets before the first
          # publish — required because publishConfig.registry is the
          # public npm registry. If you switch publishConfig to GitHub
          # Packages (https://npm.pkg.github.com), the GITHUB_TOKEN above
          # is enough and this NPM_TOKEN line can be removed.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
